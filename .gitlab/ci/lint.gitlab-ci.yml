---

lint:
  stage: lint
  needs: []
  dependencies: []
  extends:
    - .default-retry
    - .interruptible
    - .toolset:lint
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".pre-commit-cache", cache]
  rules:
    - !reference [".lint:rules", rules]
  variables:
    # Full git history is required so the merge-base commit is reachable
    # when pre-commit diffs against $CI_MERGE_REQUEST_DIFF_BASE_SHA.
    GIT_DEPTH: "0"
  before_script:
    - !reference [".mise-before_script", before_script]
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        mise run pre-commit:run -- "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
      else
        mise run pre-commit:run
      fi

lint:renovate-config:
  stage: lint
  extends:
    - .renovate-image
    - .default-retry
    - .interruptible
  needs: []
  dependencies: []
  rules:
    - !reference [".lint:renovate-config:rules", rules]
  script:
    # --strict also fails on options Renovate would silently migrate.
    - renovate-config-validator --strict
