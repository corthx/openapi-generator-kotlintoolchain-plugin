---

# Self-hosted Renovate runner. Executes only on the SCHEDULE_TASK=renovate
# schedule (terraform/live/pipeline-schedule-renovate), authenticated as the
# renovate bot (terraform/live/renovate-bot).
# All other jobs in this pipeline are gated on merge_request_event,
# default-branch push, or web release, so a scheduled pipeline runs
# only this job.

renovate:
  stage: maintenance
  needs: []
  dependencies: []
  image:
    name: renovate/renovate:43.288.0
    entrypoint: [""]
  extends:
    - .not-interruptible
  rules:
    - !reference [".renovate:rules", rules]
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "${CI_API_V4_URL}"
    RENOVATE_AUTODISCOVER: false # Disable Renovate "scan every repo I can see" mode
    RENOVATE_REPOSITORIES: "${CI_PROJECT_PATH}"
    # RENOVATE_TOKEN and RENOVATE_GIT_AUTHOR_EMAIL are CI/CD variables set by
    # the renovate bot's unit. Commits must use the bot's GitLab-assigned email,
    # or GitLab doesn't attribute them to it.
    RENOVATE_GIT_AUTHOR: "Renovate Bot <$RENOVATE_GIT_AUTHOR_EMAIL>"
  script:
    - renovate
