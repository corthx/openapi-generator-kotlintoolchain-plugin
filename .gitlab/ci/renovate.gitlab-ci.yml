---
# Self-hosted Renovate: GitLab has no hosted Renovate app, so the renovate job
# runs from this project's own pipeline, triggered by the SCHEDULE_TASK=renovate
# schedule (terraform/live/pipeline-schedule-renovate) and authenticated as the
# renovate bot (terraform/live/renovate-bot). The update policy itself lives in
# renovate.json5. The job doesn't use mise: the Renovate image ships everything.

renovate:
  stage: maintenance
  extends:
    - .renovate-image
    - .default-retry
    - .not-interruptible
    - .no-checkout
  needs: []
  dependencies: []
  rules:
    - !reference [".renovate:rules", rules]
  cache:
    - !reference [".renovate-cache", cache]
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    # RENOVATE_TOKEN is the renovate bot's token, set as a CI/CD variable by
    # its unit. RENOVATE_GITHUB_COM_TOKEN (set by hand) lifts github.com's
    # anonymous rate limit, which the changelog and release lookups would hit.
    # Commits must use the bot's GitLab-assigned email, or GitLab doesn't
    # attribute them to it.
    RENOVATE_GIT_AUTHOR: "Renovate Bot <$RENOVATE_GIT_AUTHOR_EMAIL>"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
  script:
    - renovate
