---

# Shared foundations for all jobs in this pipeline.
# Hidden jobs (keys prefixed with `.`) defined here are referenced from
# sibling files via `!reference [...]` or `extends:` because YAML anchors
# do not cross the wildcard include in .gitlab-ci.yml.

default:
  # The `-debian` flavor, not the bare tag: the bare tag is a minimal image
  # with no shell at all, which the runner cannot start a job in. Neither ships
  # node or python any more, so mise.toml pins them for the npm/pipx tools.
  #
  # entrypoint: [""] overrides the image's ENTRYPOINT ["mise"], otherwise GitLab
  # Runner's job shell would launch as `mise -c <script>` and mise would reject
  # the unknown `-c` flag before our script runs.
  image:
    name: jdxcode/mise:2026.10.3-debian
    entrypoint: [""]

variables:
  MISE_DATA_DIR: $CI_PROJECT_DIR/.mise-data
  # Loads mise.ci.toml on top of mise.toml, and leaves mise.dev.toml out.
  MISE_ENV: ci
  MISE_YES: "1"
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-data
  # Undocumented Kotlin Toolchain env var (equivalent to --shared-cache-dir).
  # yamllint disable-line rule:line-length
  # Source: https://github.com/JetBrains/kotlin-toolchain/blob/main/sources/core/src/org/jetbrains/amper/core/AmperUserCacheRoot.kt#L75C28-L75C51.
  # On Linux, XDG_CACHE_HOME is also honored as a lower-priority fallback.
  KOTLIN_SHARED_CACHE_DIR: $CI_PROJECT_DIR/.kotlin-shared-cache
  # Redirect the Kotlin CLI bootstrap cache (distribution + JRE) into the project
  # directory so GitLab CI can cache it. Without this, the bootstrap cache lands in
  # $HOME/.cache/... which is outside CI_PROJECT_DIR and never persisted.
  # Documented in the ./kotlin wrapper script header.
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: $CI_PROJECT_DIR/.kotlin-cli-cache

.default-retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.interruptible:
  interruptible: true

.not-interruptible:
  interruptible: false

# Per-job tool sets. Adding a tool to mise.toml does not make it available to a
# job — add it to the sets that need it.
.toolset:java:
  variables:
    TOOLSET: java
    TOOLSET_TOOLS: "java"

.toolset:lint:
  variables:
    TOOLSET: lint
    # java: ktlint is a JAR launched through the JVM.
    TOOLSET_TOOLS: "java node python pre-commit ktlint actionlint markdownlint-cli2 pipx pipx:yamllint"

.toolset:release:
  variables:
    TOOLSET: release
    TOOLSET_TOOLS: "git-cliff"

# Base before_script: install the job's mise-managed tools and put them on PATH.
# Pair it with one of the `.toolset:*` sets above.
.mise-before_script:
  before_script:
    - mise trust --yes
    # Unquoted: TOOLSET_TOOLS is a space-separated list that must word-split.
    - mise install $TOOLSET_TOOLS
    # Activate mise's managed env (JAVA_HOME, PATH with the installed tools)
    # into the shell so subsequent script lines can call tools directly
    # without a `mise exec --` prefix.
    - eval "$(mise env -s bash)"

.mise-cache:
  cache:
    key:
      files:
        - mise.toml
        - mise.ci.toml
      # One archive per tool set. Sharing a key across sets means the last job to
      # finish overwrites the archive with its own subset, and the next pipeline
      # reinstalls from scratch.
      prefix: $TOOLSET
    paths:
      - $MISE_DATA_DIR/
    policy: pull-push

.pre-commit-cache:
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - $PRE_COMMIT_HOME/
    policy: pull-push

.kotlin-cache:
  cache:
    key:
      files:
        - libs.versions.toml
        - project.yaml
    paths:
      - $KOTLIN_CLI_BOOTSTRAP_CACHE_DIR/
      - $KOTLIN_SHARED_CACHE_DIR/
      - build/
    policy: pull-push
