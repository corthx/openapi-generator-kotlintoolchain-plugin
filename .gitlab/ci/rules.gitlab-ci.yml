    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:pipeline-schedule:renovate:
  rules:
    - <<: *if-merge-request-label-tofu-apply
      when: manual
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-renovate-patterns
      when: manual
    - <<: *if-manual-run
      when: manual

.tofu:rules:plan:pipeline-schedule:deps-digest:
  rules:
    - <<: *if-merge-request
      changes: *tofu-pipeline-schedule-deps-digest-patterns
    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-deps-digest-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:pipeline-schedule:deps-digest:
