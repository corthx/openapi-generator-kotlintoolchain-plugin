    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-token-rotation-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:pipeline-schedule:token-rotation:
