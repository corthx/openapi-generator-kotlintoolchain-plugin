---

# Centralized conditions, change patterns, and composite rule sets — GitLab
# style. Bare-mapping condition anchors (&if-*) and bare-list pattern anchors
# (&*-patterns) are combined into composite `.*:rules` sets via YAML merge keys
# (<<:) and aliases (*). Anchors are a same-file feature, so they only build the
# composites here; jobs in the sibling .gitlab/ci/*.gitlab-ci.yml files consume
# the composites via `!reference [".x:rules", rules]`, which does cross the
# include. Never `!reference` the bare `.if-*` / `.*-patterns` anchors from
# another file.
#
# Merging a condition into a rule (rather than referencing a whole rules list)
# is what lets a composite add `changes:`, `when:`, or `variables:` to it.

# --- Condition anchors (bare mappings; merged into a rule with `<<:`) ---------

.if-merge-request: &if-merge-request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.if-merge-request-label-tofu-plan: &if-merge-request-label-tofu-plan
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)tofu:plan(,|$)/'

.if-merge-request-label-tofu-apply: &if-merge-request-label-tofu-apply
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)tofu:apply(,|$)/'

.if-default-branch: &if-default-branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

.if-release: &if-release
  if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE == "true" && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'

.if-manual-run: &if-manual-run
  if: '$CI_PIPELINE_SOURCE == "web" && $MANUAL_RUN == "true"'

.if-destroy-infra: &if-destroy-infra
  if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $DESTROY_INFRA == "true"'

.if-schedule-renovate: &if-schedule-renovate
  if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "renovate"'

.if-schedule-deps-digest: &if-schedule-deps-digest
  if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "deps-digest"'

.if-schedule-token-rotation: &if-schedule-token-rotation
  if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "token-rotation"'

# --- Change-pattern anchors (bare lists; aliased into a rule's `changes:`) ----

.gitlab-ci-patterns: &gitlab-ci-patterns
  - .gitlab-ci.yml
  - .gitlab/ci/**/*

.mise-patterns: &mise-patterns
  - mise.toml
  - mise.ci.toml

.kotlin-patterns: &kotlin-patterns
  - plugin-core/**/*
  - tests/**/*
  - project.yaml
  - libs.versions.toml
  - kotlin
  - kotlin.bat

.tofu-tofu-bot-patterns: &tofu-tofu-bot-patterns
  - terraform/live/tofu-bot/**/*

.tofu-labels-patterns: &tofu-labels-patterns
  - terraform/live/labels/**/*

.tofu-issue-boards-patterns: &tofu-issue-boards-patterns
  - terraform/live/issue-boards/**/*

.tofu-pipeline-schedule-token-rotation-patterns: &tofu-pipeline-schedule-token-rotation-patterns
  - terraform/live/pipeline-schedule-token-rotation/**/*

.tofu-terraform-provider-bot-patterns: &tofu-terraform-provider-bot-patterns
  - terraform/live/terraform-provider-bot/**/*

.tofu-terraform-provider-rotator-bot-patterns: &tofu-terraform-provider-rotator-bot-patterns
  - terraform/live/terraform-provider-rotator-bot/**/*

.tofu-renovate-bot-patterns: &tofu-renovate-bot-patterns
  - terraform/live/renovate-bot/**/*

.tofu-pipeline-schedule-renovate-patterns: &tofu-pipeline-schedule-renovate-patterns
  - terraform/live/pipeline-schedule-renovate/**/*

.tofu-pipeline-schedule-deps-digest-patterns: &tofu-pipeline-schedule-deps-digest-patterns
  - terraform/live/pipeline-schedule-deps-digest/**/*

# --- Composite rule sets (the public API — `!reference` these from jobs) ------

# MR pipelines only build when something that can affect the build changed;
# every other pipeline type always builds.
.build:rules:
  rules:
    - <<: *if-merge-request
      changes: *kotlin-patterns
    - <<: *if-merge-request
      changes: *mise-patterns
    - <<: *if-merge-request
      changes: *gitlab-ci-patterns
    - <<: *if-default-branch
    - <<: *if-release
    - <<: *if-manual-run

# Same conditions as .build:rules: check needs build, so it must never run in a
# pipeline that build is absent from.
.check:rules:
  rules:
    - <<: *if-merge-request
      changes: *kotlin-patterns
    - <<: *if-merge-request
      changes: *mise-patterns
    - <<: *if-merge-request
      changes: *gitlab-ci-patterns
    - <<: *if-default-branch
    - <<: *if-release
    - <<: *if-manual-run

.lint:rules:
  rules:
    - <<: *if-merge-request
    - <<: *if-default-branch
    - <<: *if-manual-run

.release:rules:
  rules:
    - <<: *if-release

.renovate:rules:
  rules:
    - <<: *if-schedule-renovate

.deps-digest:rules:
  rules:
    - <<: *if-schedule-deps-digest

.tofu:rules:plan:tofu-bot:
  rules:
    - <<: *if-merge-request
      changes: *tofu-tofu-bot-patterns
    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-tofu-bot-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra
    - <<: *if-schedule-token-rotation

.tofu:rules:apply:tofu-bot:
  rules:
    - <<: *if-merge-request-label-tofu-apply
      when: manual
    - <<: *if-default-branch
      changes: *tofu-tofu-bot-patterns
      when: manual
    - <<: *if-manual-run
      when: manual
    - <<: *if-schedule-token-rotation

.tofu:rules:plan:labels:
  rules:
    - <<: *if-merge-request
      changes: *tofu-labels-patterns
    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-labels-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:labels:
  rules:
    - <<: *if-merge-request-label-tofu-apply
      when: manual
    - <<: *if-default-branch
      changes: *tofu-labels-patterns
      when: manual
    - <<: *if-manual-run
      when: manual

.tofu:rules:plan:issue-boards:
  rules:
    - <<: *if-merge-request
      changes: *tofu-issue-boards-patterns
    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-issue-boards-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:issue-boards:
  rules:
    - <<: *if-merge-request-label-tofu-apply
      when: manual
    - <<: *if-default-branch
      changes: *tofu-issue-boards-patterns
      when: manual
    - <<: *if-manual-run
      when: manual

.tofu:rules:plan:pipeline-schedule:token-rotation:
