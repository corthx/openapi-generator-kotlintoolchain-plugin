      when: manual
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-token-rotation-patterns
      when: manual
    - <<: *if-manual-run
      when: manual

.tofu:rules:plan:pipeline-schedule:renovate:
  rules:
