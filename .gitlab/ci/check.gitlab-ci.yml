---

check:
  stage: check
  needs:
    - job: build
      artifacts: false
  extends:
    - .default-retry
    - .interruptible
    - .toolset:java
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".kotlin-cache", cache]
  rules:
    - !reference [".check:rules", rules]
  before_script:
    - !reference [".mise-before_script", before_script]
  variables:
    # Modules per `./kotlin check` run; see the script header for why.
    KOTLIN_CHECK_BATCH_SIZE: "6"
  script:
    - bash .gitlab/ci/scripts/kotlin-check-batched.sh
